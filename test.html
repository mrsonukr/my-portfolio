<style>
  .m-nav {
    display: block;
    width: calc(100% - 64px);
    position: fixed;
    left: 32px;
    top: 60px; /* Adjust based on your header height */
    background-color: white;
    border: 1.5px solid black;
    border-radius: 12px;
    padding: 16px 5%;
    box-shadow:
      0 2px 4px -2px rgba(16, 24, 40, 0.03),
      0 12px 16px -4px rgba(16, 24, 40, 0.08);
    transition: transform 0.3s ease, opacity 0.3s ease;
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
  }

  .m-nav.visible {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }

  .m-nav__list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0;
    margin: 0;
  }

  .m-nav__item a {
    text-decoration: none;
    color: var(--link);
    display: block;
    padding: 5px 0;
    transition: color 0.3s ease-in-out;
  }

  .m-nav__item a:hover {
    color: black;
  }
</style>

<!-- Toggle button for showing/hiding the navigation -->
<button id="toggle">Toggle Menu</button>

<div class="m-nav">
  <ul class="m-nav__list">
    <li class="m-nav__item"><a href="#">Email</a></li>
    <li class="m-nav__item"><a href="#">About</a></li>
    <li class="m-nav__item"><a href="#">Contact</a></li>
  </ul>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const toggleButton = document.getElementById("toggle");
  const mobileNav = document.querySelector(".m-nav");

  toggleButton.addEventListener("click", function () {
    mobileNav.classList.toggle("visible");
  });
});
</script>
